[Language_en]
Name=Part 6 - Strike on Keflavik
Description=NATO's air operations over the North Atlantic are sustained by Keflavik air base in Iceland. A Tu-22M Backfire regiment is tasked to suppress Keflavik's radar and logistics facilities. {TaskForceName} provides air defence escort and missile suppression.
MissionBriefingGenerateMapFromSymbols=True
MapSymbol_New1Label_en=Keflavik Target Area
MapSymbol_New2Label_en=Keflavik Air Base
Taskforce1StartMessage=<size=16>{TaskForceName}: Part 6</size>\nSTRIKE ON\nKEFLAVIK|Keflavik has been the thorn in our side since we entered the North Atlantic. P-3 Orions sortie from there constantly, and its F-15s have intercepted two of our Tu-95 reconnaissance aircraft.\n\nA regiment of Tu-22M Backfires has been staged to Iceland's south. Their job is to put AS-4 Kitchen missiles into Keflavik's radar arrays and fuel facilities.\n\nYour job is to keep NATO's air defence frigates off the bombers' approach corridor and suppress any surface SAM threats.\n\nKeflavik must burn, Comrade. Protect the bombers.|Start mission
Taskforce1KirovSunkMessage=MISSION FAILED|The {FlagshipName} has been sunk. The task force must withdraw; this mission has failed.|Exit mission
Taskforce1BackfireLostMessage=MISSION FAILED|The Tu-22M strike package has been lost before Keflavik was suppressed. The base remains operational.|Exit mission
Taskforce1KeflavikSuppressedMessage=MISSION ACCOMPLISHED|Keflavik's radar systems and fuel storage have been destroyed. NATO's maritime patrol coverage over the North Atlantic will be blind for days.\n\nThe Backfire regiment salutes you, Commander!\n\n<size=16>All crews have gained a proficiency level: <color=DarkOrange>Veteran</color></size>|Exit mission
Objective_SuppressKeflavik=Protect the Tu-22M strike package and ensure Keflavik radar destruction
Objective_KirovSurvives={FlagshipName} must survive
Objective_BackfiresSurvive=At least one Tu-22M must survive

