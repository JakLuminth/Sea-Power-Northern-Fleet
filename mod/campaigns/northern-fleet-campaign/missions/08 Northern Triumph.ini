[Language_en]
Name=Part 8 - Northern Triumph
Description=The final mission. With NATO's carrier forces crippled and Keflavik suppressed, {TaskForceName} must secure the Norwegian Sea and escort five Soviet reinforcement ships through the GIUK Gap. Victory here ends NATO's capacity to contest the North Atlantic.
MissionBriefingGenerateMapFromSymbols=True
MapSymbol_New1Label_en=GIUK Exit Corridor
MapSymbol_New2Label_en=Reinforcement Convoy
Taskforce1StartMessage=<size=16>{TaskForceName}: Part 8</size>\nNORTHERN\nTRIUMPH|This is it, Comrade Commander. The final mission.\n\nNATO is throwing everything they have left into one last attempt to seal the GIUK Gap. A mixed force of surface combatants and submarines is converging on our position.\n\nOur reinforcement convoy — five ships with troops and equipment for the Norwegian front — must get through. Escort them through the gap. Destroy anyone who stands in the way.\n\nThe fate of the Northern campaign rests on this moment. For the Soviet Union. For the Navy. For every sailor under your command.\n\nMake history, Comrade Commander!|Start mission
Taskforce1KirovSunkMessage=MISSION FAILED|The {FlagshipName} has been sunk. The task force must withdraw; this mission has failed.|Exit mission
Taskforce1VictoryMessage=MISSION ACCOMPLISHED|{TaskForceName} has accomplished the impossible. The reinforcement convoy has crossed the GIUK Gap and the Norwegian Sea is ours.\n\nThe Northern campaign is complete, Comrade Commander. Outstanding work!|Exit mission
Taskforce1ConvoyLostMessage=MISSION FAILED|The reinforcement convoy has suffered unacceptable losses before reaching the GIUK Gap. The final operation has failed.|Exit mission
Objective_EscortConvoy=Escort the reinforcement convoy through the GIUK Gap
Objective_KirovSurvives={FlagshipName} must survive

