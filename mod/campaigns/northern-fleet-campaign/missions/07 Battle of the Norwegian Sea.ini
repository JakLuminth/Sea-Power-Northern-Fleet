[Language_en]
Name=Part 7 - Battle of the Norwegian Sea
Description=With the Nimitz badly damaged and Keflavik suppressed, NATO has committed its second carrier battle group — USS Enterprise — to hunt down {TaskForceName}. This is the moment that will decide the battle for the North Atlantic.
MissionBriefingGenerateMapFromSymbols=True
MapSymbol_New1Label_en=Enterprise Engagement Area
MapSymbol_New2Label_en=Norwegian Sea
Taskforce1StartMessage=<size=16>{TaskForceName}: Part 7</size>\nBATTLE OF THE\nNORWEGIAN SEA|The USS Enterprise and her escorts are closing from the west. They know our position. There is nowhere to run — nor would we want to.\n\nThis is the decisive engagement of the North Atlantic campaign. Our task force against NATO's most powerful remaining carrier group.\n\nThe {FlagshipName}'s P-700 missiles have a range of 550 kilometers. Use them. Our submarines should target the Enterprise first. The escorts will follow.\n\nIf we destroy the Enterprise here, NATO has no carrier capability in the Atlantic. The war at sea is ours.\n\nFor the Motherland, Comrade Commander!|Start mission
Taskforce1KirovSunkMessage=MISSION FAILED|The {FlagshipName} has been sunk. The task force must withdraw; this mission has failed.|Exit mission
Taskforce1EnterpriseDestroyedMessage=MISSION ACCOMPLISHED|USS Enterprise has been struck and is aflame. Her escorts are breaking off. NATO's Atlantic carrier force has been eliminated.\n\nThis day will be remembered. The Norwegian Sea belongs to the Soviet Navy.\n\nAny surviving Slava-class cruiser will be retained for the final campaign operation.\n\n<size=16>All crews have gained a proficiency level: <color=DarkOrange>Elite</color></size>|Exit mission
Objective_DestroyEnterprise=Strike and destroy the USS Enterprise
Objective_KirovSurvives={FlagshipName} must survive

