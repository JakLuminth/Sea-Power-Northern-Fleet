[Language_en]
Name=Part 3 - Convoy HX-412
Description=NATO convoy HX-412 — eight merchant ships carrying war materiel to Britain — has been located in the North Atlantic. {TaskForceName} and its submarine wolf pack are ordered to destroy it before it reaches port.
MissionBriefingGenerateMapFromSymbols=True
MapSymbol_New1Label_en=Convoy HX-412 Operating Area
MapSymbol_New2Label_en=Convoy HX-412
Taskforce1StartMessage=<size=16>{TaskForceName}: Part 3</size>\nCONVOY\nHX-412|Intelligence from a Tu-95RT reconnaissance aircraft has fixed the convoy's position.\n\nConvoy HX-412 is eight merchant ships — freighters, bulk carriers, and vehicle carriers — screened by eight NATO surface escorts and two attack submarines. If it reaches Britain, it will supply Allied forces for months.\n\nYour submarines should go in first. Draw out the escorts. Then the task force closes and finishes the job with missiles.\n\nSink every merchant. Leave nothing carrying war materiel afloat, Comrade Commander.|Start mission
Taskforce1KirovMustSurviveMessage=MISSION FAILED|The {FlagshipName} has been sunk. The task force must withdraw; this mission has failed.|Exit mission
Taskforce1ConvoyDestroyedMessage=MISSION ACCOMPLISHED|All eight merchant ships of convoy HX-412 have been destroyed. The escorts can no longer deliver NATO's war materiel to Britain.\n\nNATO's reinforcement schedule has been set back by months. The Motherland thanks you, Commander!\n\nAny surviving Sovremenny-class destroyer will be retained in the task force for follow-on operations.\n\n<size=16>All crews have gained a proficiency level: <color=DarkOrange>Seasoned</color></size>|Exit mission
Objective_DestroyConvoy=Locate and destroy the NATO convoy
Objective_KirovSurvives={FlagshipName} must survive

