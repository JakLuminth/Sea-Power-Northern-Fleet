[TaskForceRibbons]
; Soviet Navy awards for Northern Fleet campaign.
; To add a ribbon: define RibbonIds=<id1>|<id2>|... then add a [Ribbon_<id>] section for each.
; Each ribbon needs: Type, Precedence, Name_en, ImagePath (ribbon bar PNG), MedalImagePath (optional),
; StripeColors, StripeWidths, CitationIssuingBody_en, CitationIssuance_en, CitationAuthority_en,
; CitationRecipient_en, CitationSignatureName_en, CitationSignatureTitle_en.
; Art must be placed under campaigns/northern-fleet-campaign/art/ribbons/ and art/medals/.
; Leave RibbonIds empty until art assets are ready to avoid engine errors.
RibbonIds=

