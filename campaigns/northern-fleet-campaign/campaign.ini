Name_en=Battle of the Norwegian Sea
MissionSequenceName_en=MISSION 7
MapShortName_en=07
Description_en=28 June 1985: A NATO carrier battle group has been dispatched to hunt down the task force. A decisive surface and air engagement is now unavoidable. The fate of Soviet naval power in the Atlantic rests on the outcome of this battle.
MissionIntro_en=SACLANT has committed a full carrier battle group to destroying your task force. The engagement will be decisive — there is no room for an inconclusive result. Your missiles must reach the carrier before her air wing reaches you. Deploy your submarines on the flanks to disrupt the escort screen. Win here and the Norwegian Sea belongs to the Soviet Navy.
