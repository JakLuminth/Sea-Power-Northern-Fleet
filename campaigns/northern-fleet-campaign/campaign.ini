Description_en=11 June 1985 (OPTIONAL): A damaged British destroyer has been spotted broadcasting distress signals near Bear Island. Intelligence suspects a trap — but also a rare chance to destroy one of NATO's most capable ASW coordination ships. The decision is yours, Comrade Commander.
