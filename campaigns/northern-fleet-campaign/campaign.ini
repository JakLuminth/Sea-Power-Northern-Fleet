MissionIntro_en=The SOSUS relay station at Nordkapp has been compromising Soviet submarine operations throughout the Norwegian Sea. GRU has confirmed its position. A submarine strike team will approach from seaward while your task force provides air cover and suppresses the coastal defence frigate. Destroy the relay station and its associated radar equipment. Expect Norwegian coastal defence assets and NATO reinforcements once the attack begins.

