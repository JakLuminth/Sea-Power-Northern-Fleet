[Language_en]
Name=Northern Fleet '85 (Warsaw Pact - Task Force Mode)
Description=It is June 1985. The Cold War has turned hot. As commander of a Soviet Northern Fleet task force, your orders are to break NATO's Atlantic lifeline, deny the GIUK Gap to Allied reinforcements, and strike fear into the heart of the Western alliance. Build your force, choose your flagship, and take the fight to the enemy.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: This is a persistent Task Force Mode campaign. Ship and aircraft losses, damage, and ammunition expenditures carry forward between missions. Manage your resources wisely — the Motherland is counting on you, Comrade Commander!

