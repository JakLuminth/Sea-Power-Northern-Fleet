Name_en=Strike on Keflavik
MissionSequenceName_en=MISSION 6
MapShortName_en=06
Description_en=24 June 1985: NATO's P-3 Orions and F-15s based at Keflavik, Iceland have been the backbone of Allied anti-submarine and air defence operations in the North Atlantic. A Tu-22M strike package is tasked to suppress the base. Your task force must provide escort and SEAD support.
MissionIntro_en=Keflavik is the most important NATO air base in the North Atlantic. Its P-3 Orions have been hunting your submarines since the campaign began; its F-15s have denied your aircraft freedom of movement over the Norwegian Sea. A regiment of Tu-22M Backfire bombers has been tasked to destroy it. Your task force must escort the strike package, suppress NATO surface combatants along the ingress route, and hold off the interceptor response long enough for the Backfires to deliver their weapons.

