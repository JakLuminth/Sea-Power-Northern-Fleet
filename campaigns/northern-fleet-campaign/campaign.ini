MissionIntro_en=Soviet intelligence has confirmed that NATO forces are tracking Northern Fleet movements from the moment of departure. P-3 Orion maritime patrol aircraft and at least one NATO SSN are believed to be operating in the Barents Sea along your intended transit corridor. Break out of the Barents Sea and reach open water. Do not allow the task force to be fixed and engaged before you have sea room.

