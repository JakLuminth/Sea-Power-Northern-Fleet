Name_en=Jan Mayen Resupply
MissionSequenceName_en=MISSION 5
MapShortName_en=05
Description_en=20 June 1985: A Soviet logistics ship has rendezvous'd near Jan Mayen. The task force takes on ammunition and effects repairs before the next push. But NATO recon aircraft have found us — defend the anchorage.
MissionIntro_en=The logistics rendezvous at Jan Mayen has been compromised. NATO reconnaissance aircraft have reported the anchorage and a strike package is inbound. The task force must hold position long enough to complete rearming and effect critical repairs. Destroy all inbound strike aircraft before they can damage the logistics ship. Your air defences are the last line of protection.
MissionResupplyRules_en=Your task force will be fully rearmed at Jan Mayen. Repair facilities are available. The Task Force Builder is open — reinforce before the push into Iceland.
TaskForceModeBuilderSituation_en=The Jan Mayen anchorage is your last safe rearm point before the Icelandic approach. Rebuild the task force around a hardened escort screen, restore the aircraft complement, and keep enough submarine depth available for tactical interdiction.
