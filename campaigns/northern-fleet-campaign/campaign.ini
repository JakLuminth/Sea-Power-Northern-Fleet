Name_en=Convoy HX-412
MissionSequenceName_en=MISSION 3
MapShortName_en=03
Description_en=14 June 1985: Intelligence has identified NATO convoy HX-412 — eight merchant ships and their escorts — transiting the North Atlantic toward Britain. Destroy the convoy before it reaches port.
MissionIntro_en=Convoy HX-412 is carrying war materiel and reinforcements critical to NATO's ability to sustain operations in Europe. GRU has provided an intercept course. Your task force must destroy every merchant ship before the escorts can organise an effective defence. Submarine assets will work the flanks. Strike fast — NATO carrier-based air will respond once the convoy breaks radio silence.
MissionResupplyRules_en=After this mission, the task force will be rearmed and repair facilities will be available. Reinforce your task force before pressing further into the Atlantic.
TaskForceModeBuilderSituation_en=Use this rearm point to rebuild a balanced Atlantic strike group. Keep enough escort power to protect the main body, assign air cover for the convoy approach, and preserve submarines for flanking pressure rather than overcommitting them early.
