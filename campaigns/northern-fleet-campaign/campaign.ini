Name_en=Northern Triumph
MissionSequenceName_en=MISSION 8
MapShortName_en=08
Description_en=2 July 1985: With the NATO carrier group crippled, the task force turns north to secure the Norwegian Sea and escort a final wave of Soviet reinforcements through the GIUK Gap. Victory here will seal NATO's fate in the Atlantic.
MissionIntro_en=The carrier threat has been neutralised. Now the task force must exploit that victory before NATO can reconstitute its defences. A convoy of Soviet reinforcements is transiting the GIUK Gap under your protection. NATO has committed its remaining surface and submarine assets to stop them. Escort the convoy to safety. This is the final operation — do not let the reinforcements be lost this close to victory.
MissionResupplyRules_en=Your task force will be fully rearmed and repaired before this final operation. All available reinforcements have been committed. The Task Force Builder is open for the last time — spend everything you have.
TaskForceModeBuilderSituation_en=This is the final Atlantic push. Spend the last points on the strongest escort mix you can support, then add enough air and submarine depth to dominate the convoy lane and prevent NATO from regrouping.
