[Language_en]
Name=Part 5 - Jan Mayen Resupply
Description=A Soviet logistics vessel has rendezvous'd near Jan Mayen Island. The task force must defend the anchorage against NATO air strikes while taking on ammunition and conducting repairs.
MissionBriefingGenerateMapFromSymbols=True
MapSymbol_New1Label_en=Jan Mayen Anchorage
MapSymbol_New2Label_en=Berezina Resupply Ship
Taskforce1StartMessage=<size=16>{TaskForceName}: Part 5</size>\nJAN MAYEN\nRESUPPLY|Our supply ship Berezina has been waiting at Jan Mayen Island with reload missiles and fuel.\n\nThe task force is to anchor and resupply — but NATO reconnaissance has located us. Strike aircraft are already being vectored in from Iceland and Norway.\n\nDefend the anchorage. Keep the {FlagshipName} and the Berezina alive until resupply is complete. Your air defence batteries are your best asset here.\n\nWe cannot continue the campaign without these supplies. Hold the anchorage, Comrade Commander!|Start mission
Taskforce1ResupplyCompleteMessage=MISSION ACCOMPLISHED|Resupply is complete. {TaskForceName} is fully rearmed and ready to continue operations.\n\nNATO threw everything they had at us — and we held. Outstanding discipline, Commander!|Exit mission
Taskforce1KirovSunkMessage=MISSION FAILED|The {FlagshipName} has been sunk. The task force must withdraw; this mission has failed.|Exit mission
Taskforce1BerezinaSunkMessage=MISSION FAILED|The Berezina has been sunk before resupply could be completed. The anchorage is no longer viable; withdraw the task force.|Exit mission
Objective_DefendAnchorage=Defend the anchorage until resupply is complete
Objective_KirovSurvives={FlagshipName} must survive
Objective_BerezinaSurvives=The Berezina must survive

