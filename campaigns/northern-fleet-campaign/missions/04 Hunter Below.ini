[Language_en]
Name=Part 4 - Hunter Below
Description=A detached Soviet submarine wolf pack has tracked the USS Nimitz carrier battle group to its operating area south of Iceland. The surface task force holds position while the submarines move in for a decisive strike.
MissionBriefingGenerateMapFromSymbols=True
MapSymbol_New1Label_en=Nimitz Operating Area
Taskforce1StartMessage=<size=16>{TaskForceName}: Part 4</size>\nHUNTER\nBELOW|Sonar contact. The Nimitz battle group — America's most powerful naval force in the Atlantic — has been localized south of Iceland.\n\nThe surface task force cannot close without air cover. But our submarines can.\n\nAn Oscar-class SSGN and two Victor-class SSNs have been detached. Their mission is to strike the Nimitz and her escorts before they can reposition.\n\nOne salvo from the Oscar's P-700 missiles will change the course of this war. Don't miss, Comrade.|Start mission
Taskforce1NimitzDestroyedMessage=MISSION ACCOMPLISHED|The Nimitz has been struck and mission-killed. American naval power in the North Atlantic is shattered.\n\nThe battle group is retreating. NATO command will be in chaos. This is the moment we have been training for.\n\n<size=16>All crews have gained a proficiency level: <color=DarkOrange>Veteran</color></size>|Exit mission
Taskforce1SubsSunkMessage=MISSION FAILED|Our submarine force has been destroyed by the Nimitz's ASW screen. The carrier group survives — and it knows exactly where we are.|Exit mission
Objective_StrikeNimitz=Strike and disable the USS Nimitz
Objective_SubsSurvive=At least one submarine must survive

