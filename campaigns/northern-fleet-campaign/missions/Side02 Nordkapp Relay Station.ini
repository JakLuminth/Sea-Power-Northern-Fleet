[Language_en]
Name=Side Mission - Nordkapp Relay Station
Description=A NATO SOSUS hydrophone relay and radar installation at Nordkapp, Norway has been tracking every Soviet submarine in the Norwegian Sea. GRU wants it destroyed. A submarine-launched cruise missile strike, covered by the task force's air defence umbrella, is the only viable option — but Norwegian coastal defence forces will respond.
MissionBriefingGenerateMapFromSymbols=True
MapSymbol_New1Label_en=Nordkapp Target Area
MapSymbol_New2Label_en=Nordkapp SOSUS Relay
Taskforce1StartMessage=<size=16>Side Mission</size>\nNORDKAPP\nRELAY STATION|GRU has provided us with precise coordinates for NATO's Nordkapp relay station.\n\nThis installation is the reason NATO keeps finding our submarines. It ties directly into the SOSUS network and feeds data to the P-3 Orion squadrons hunting our boats.\n\nAn Oscar-class SSGN will launch P-700 cruise missiles at the facility from outside coastal radar range. Norwegian patrol boats and coastal defence forces will respond the moment we fire.\n\nYour task force must provide an air defence screen and suppress any surface threats that break through.\n\nSilence Nordkapp, Comrade Commander. Let our submarines breathe again.|Start mission
Taskforce1NordkappDestroyedMessage=MISSION ACCOMPLISHED|The Nordkapp SOSUS relay and its associated radar installation have been destroyed. NATO's submarine-tracking coverage in the Norwegian Sea now has a critical blind spot.\n\nOur submarine commanders report that tracking contacts have dropped sharply. You have given them room to manoeuvre.\n\n<size=16>Bonus: Soviet submarine crew proficiency increased for the remainder of the campaign</size>|Exit mission
Taskforce1KirovSunkMessage=MISSION FAILED|The {FlagshipName} has been sunk. The task force must withdraw; this mission has failed.|Exit mission
Taskforce1SubmarineLostMessage=MISSION FAILED|The Oscar strike submarine has been destroyed before the Nordkapp strike could be completed. The relay station remains operational.|Exit mission
Objective_DestroyNordkapp=Destroy the Nordkapp SOSUS relay and radar installation
Objective_KirovSurvives={FlagshipName} must survive
Objective_SubmarineSurvives=The Oscar strike submarine must survive

