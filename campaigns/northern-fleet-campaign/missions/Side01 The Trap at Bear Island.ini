[Language_en]
Name=Side Mission - The Trap at Bear Island
Description=A crippled British destroyer near Bear Island is broadcasting distress. Our intelligence officer believes it is bait — a carefully laid trap to draw the task force into a waiting ambush. But the ship may also be carrying NATO's senior ASW coordinator for the Norwegian Sea. A high-risk, high-reward opportunity.
MissionBriefingGenerateMapFromSymbols=True
MapSymbol_New1Label_en=Sheffield Objective Area
MapSymbol_New2Label_en=Bear Island
Taskforce1StartMessage=<size=16>Side Mission</size>\nTHE TRAP AT\nBEAR ISLAND|Signals intelligence has picked up distress calls from HMS Sheffield — reportedly dead in the water twelve nautical miles northeast of Bear Island.\n\nOur intelligence officer, Captain Morozov, believes this is deliberate. NATO knows we will investigate. At least two Los Angeles-class submarines are likely waiting nearby.\n\nHowever, GRU confirms that Rear Admiral James Whitfield — NATO's chief ASW coordinator for the Norwegian Sea — transferred his flag to Sheffield two days ago. If he goes down with the ship, NATO loses its most experienced submarine hunter.\n\nThe risk is real. The reward may be greater. The decision is yours, Comrade Commander.|Start mission
Break off or fight your way through — but don't lose the {FlagshipName}.|Continue mission
Taskforce1SheffieldDestroyedMessage=MISSION ACCOMPLISHED|HMS Sheffield has been sunk. Rear Admiral Whitfield's fate is unknown, but NATO's Norwegian Sea ASW command has been decapitated.\n\nYour submarines handled the ambush with skill. Excellent work under pressure, Commander!\n\n<size=16>Bonus: +20 Campaign Points awarded for eliminating a high-value target</size>|Exit mission
Taskforce1KirovSunkMessage=MISSION FAILED|The {FlagshipName} has been sunk. The task force must withdraw; this mission has failed.|Exit mission
Objective_DestroySheffield=Locate and destroy HMS Sheffield
Objective_KirovSurvives={FlagshipName} must survive
Objective_DestroyAmbush=Neutralise the submarine ambush

